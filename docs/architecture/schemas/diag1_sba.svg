<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Vue orientée service (SBA) — 3GPP TS 23.501</text>

  <line x1="70" y1="100" x2="830" y2="100" stroke="#1F4E79" stroke-width="3"/>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#1F4E79" font-style="italic">Bus de service — chaque NF expose une interface Nxxx</text>

  <!-- 8 NF boxes -->
  <!-- positions -->
  <!-- NRF -->
  <line x1="112" y1="100" x2="112" y2="140" stroke="#555" stroke-width="1.5"/>
