<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="700" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Architecture réellement déployée — testbed validé (jalon J14)</text>

  <!-- Machine A outer -->
  <rect x="30" y="50" width="840" height="540" rx="14" fill="#EAF1F8" stroke="#1F4E79" stroke-width="2"/>
  <text x="50" y="78" font-size="15" font-weight="bold" fill="#1F4E79">Machine A — VM Ubuntu (100 Go disque, 8 Go RAM)</text>

  <!-- Docker box -->
  <rect x="60" y="95" width="780" height="235" rx="10" fill="#D6E4F0" stroke="#2E5C8A" stroke-width="1.5"/>
  <text x="78" y="118" font-size="13" font-weight="bold" fill="#1F4E79">Docker Engine — réseau "open5gs" (bridge)</text>

  <!-- Control plane group -->
  <rect x="80" y="128" width="440" height="175" rx="8" fill="#ffffff" stroke="#2E5C8A" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="300" y="146" text-anchor="middle" font-size="13" fill="#1F4E79" font-weight="bold">Plan de contrôle (9 conteneurs)</text>
  <g font-size="12" fill="#ffffff" font-weight="bold">
    <rect x="100" y="158" width="120" height="34" rx="6" fill="#2E5C8A"/><text x="160" y="180" text-anchor="middle">NRF</text>
    <rect x="230" y="158" width="120" height="34" rx="6" fill="#2E5C8A"/><text x="290" y="180" text-anchor="middle">AMF</text>
    <rect x="360" y="158" width="120" height="34" rx="6" fill="#2E5C8A"/><text x="420" y="180" text-anchor="middle">SMF</text>
    <rect x="100" y="200" width="120" height="34" rx="6" fill="#3D7A9E"/><text x="160" y="222" text-anchor="middle">AUSF</text>
    <rect x="230" y="200" width="120" height="34" rx="6" fill="#3D7A9E"/><text x="290" y="222" text-anchor="middle">UDM</text>
    <rect x="360" y="200" width="120" height="34" rx="6" fill="#3D7A9E"/><text x="420" y="222" text-anchor="middle">UDR</text>
    <rect x="100" y="242" width="120" height="34" rx="6" fill="#5B9BD5"/><text x="160" y="264" text-anchor="middle">PCF</text>
    <rect x="230" y="242" width="120" height="34" rx="6" fill="#5B9BD5"/><text x="290" y="264" text-anchor="middle">NSSF</text>
    <rect x="360" y="242" width="120" height="34" rx="6" fill="#5B9BD5"/><text x="420" y="264" text-anchor="middle">BSF</text>
  </g>
  <text x="290" y="290" text-anchor="middle" font-size="9" fill="#555">SCTP 38412 → IP hôte</text>

  <!-- UPF -->
  <rect x="545" y="128" width="150" height="60" rx="8" fill="#2E8B57" stroke="#1e5f3a" stroke-width="1.5"/>
  <text x="620" y="153" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">UPF</text>
  <text x="620" y="172" text-anchor="middle" font-size="10" fill="#ffffff">UDP 2152 → IP hôte</text>

  <!-- db -->
  <rect x="545" y="200" width="150" height="60" rx="8" fill="#6B7280" stroke="#374151" stroke-width="1.5"/>
  <text x="620" y="225" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">db (MongoDB 7.0)</text>
  <text x="620" y="243" text-anchor="middle" font-size="10" fill="#ffffff">db.open5gs.org</text>

  <!-- webui -->
  <rect x="715" y="128" width="105" height="132" rx="8" fill="#B08900" stroke="#8a6a00" stroke-width="1.5"/>
  <text x="767" y="190" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">webui</text>
  <text x="767" y="208" text-anchor="middle" font-size="10" fill="#ffffff">:9999</text>

  <!-- Native processes box -->
  <rect x="60" y="405" width="780" height="110" rx="10" fill="#F4F0FA" stroke="#6B4E9E" stroke-width="1.5"/>
  <text x="78" y="425" font-size="13" font-weight="bold" fill="#4B2E83">Processus natifs (hors Docker) — IP secondaire dédiée (ex. 192.168.1.13)</text>
  <rect x="100" y="435" width="150" height="60" rx="8" fill="#6B4E9E" stroke="#4B2E83" stroke-width="1.5"/>
  <text x="175" y="460" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">gNB (nr-gnb)</text>
  <text x="175" y="478" text-anchor="middle" font-size="10" fill="#ffffff">UERANSIM v3.2.7</text>
  <rect x="290" y="435" width="160" height="60" rx="8" fill="#6B4E9E" stroke="#4B2E83" stroke-width="1.5"/>
  <text x="370" y="460" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">UE (nr-ue)</text>
  <text x="370" y="478" text-anchor="middle" font-size="9" fill="#ffffff">imsi-001010000000001</text>

  <!-- N2 elbow: AMF badge bottom -> down -> left -> gNB top -->
  <polyline points="290,192 290,345 175,345 175,435" fill="none" stroke="#1F4E79" stroke-width="2.2"/>
  <text x="205" y="340" font-size="11" fill="#1F4E79" font-weight="bold">N2</text>

  <!-- N3 elbow: UPF bottom -> down -> left -> UE top -->
  <polyline points="620,188 620,368 220,368 220,435" fill="none" stroke="#2E8B57" stroke-width="2.5"/>
  <text x="420" y="363" font-size="11" fill="#2E8B57" font-weight="bold">N3 (plan usager, gNB↔UPF)</text>

  <!-- UE to Internet -->
  <line x1="370" y1="495" x2="370" y2="590" stroke="#2E8B57" stroke-width="2.5"/>
  <text x="385" y="550" font-size="12" fill="#2E8B57" font-weight="bold">tunnel uesimtun0</text>

  <!-- Internet cloud -->
  <ellipse cx="370" cy="620" rx="90" ry="30" fill="#DDEBDD" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="370" y="626" text-anchor="middle" font-size="14" fill="#1e5f3a" font-weight="bold">Internet</text>
</svg>
