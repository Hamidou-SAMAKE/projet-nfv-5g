<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Trajectoire — de l'état actuel (J14) vers l'orchestration K8s (phases 3-4)</text>

  <!-- Column headers -->
  <text x="230" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">État actuel (phases 0-2, validé)</text>
  <text x="670" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">État cible (phases 3-4)</text>

  <!-- Machine A now -->
  <rect x="60" y="90" width="340" height="130" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="2"/>
  <text x="230" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E79">Machine A (8 Go)</text>
  <text x="230" y="140" text-anchor="middle" font-size="12" fill="#333">5GC Docker (10 conteneurs)</text>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#333">+ WebUI</text>
  <text x="230" y="180" text-anchor="middle" font-size="12" fill="#333">gNB + UE natifs (UERANSIM)</text>
  <text x="230" y="202" text-anchor="middle" font-size="11" font-style="italic" fill="#2E8B57">✔ Session PDU validée</text>

  <!-- Machine B now -->
  <rect x="60" y="250" width="340" height="110" rx="10" fill="#F4F0FA" stroke="#6B4E9E" stroke-width="2"/>
  <text x="230" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#4B2E83">Machine B (32 Go)</text>
  <text x="230" y="300" text-anchor="middle" font-size="12" fill="#333">Préparation environnement</text>
  <text x="230" y="320" text-anchor="middle" font-size="12" fill="#333">Kubernetes / OSM (en parallèle)</text>

  <!-- arrow -->
  <line x1="410" y1="210" x2="500" y2="210" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F4E79"/>
    </marker>
  </defs>

  <!-- Machine A future -->
  <rect x="500" y="90" width="340" height="130" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="2"/>
  <text x="670" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E79">Machine A (8 Go)</text>
  <text x="670" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Worker node Kubernetes</text>
  <text x="670" y="170" text-anchor="middle" font-size="12" fill="#333">Pods 5GC + UERANSIM</text>
  <text x="670" y="192" text-anchor="middle" font-size="11" fill="#555">(migration Docker → K8s)</text>

  <!-- Machine B future -->
  <rect x="500" y="250" width="340" height="110" rx="10" fill="#F4F0FA" stroke="#6B4E9E" stroke-width="2"/>
  <text x="670" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#4B2E83">Machine B (32 Go)</text>
  <text x="670" y="298" text-anchor="middle" font-size="12" fill="#333">Control-plane K8s + ETSI OSM</text>
  <text x="670" y="318" text-anchor="middle" font-size="12" fill="#333">Prometheus / Grafana</text>

  <!-- Tailscale link -->
  <line x1="230" y1="220" x2="230" y2="250" stroke="#B08900" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="670" y1="220" x2="670" y2="250" stroke="#B08900" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="235" y="240" font-size="10" fill="#8a6a00">Tailscale</text>
  <text x="675" y="240" font-size="10" fill="#8a6a00">Tailscale</text>

  <text x="450" y="400" text-anchor="middle" font-size="12" font-style="italic" fill="#555">Connexion inter-machines : VPN mesh Tailscale, établie dès J1, maintenue à travers les deux états.</text>
</svg>
